					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@SELECT_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@SELECT_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: label-controller-action-select
								DropDownButton@SELECT_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@CANCEL_CONTAINER:
